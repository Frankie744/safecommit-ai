services:
  safecommit-mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: safecommit
      MYSQL_USER: safecommit
      MYSQL_PASSWORD: safecommit-local-fixture
      MYSQL_ROOT_PASSWORD: safecommit-local-root
    ports:
      - "127.0.0.1:33067:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - ../schema/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../seed/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - safecommit_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u safecommit -psafecommit-local-fixture --silent
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s
    restart: "no"

volumes:
  safecommit_mysql_data:
