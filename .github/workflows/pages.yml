name: SafeCommit public evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - hackathon/safecommit-logistics
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-public-demo.mjs"
      - "artifacts/evidence/safecommit-database-local/**"
      - "artifacts/evidence/safecommit-database-live/**"
      - "artifacts/presentation/SafeCommit_Championship_Deck_LOCAL_TEST.pdf"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build read-only evidence site
        run: node scripts/build-public-demo.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
